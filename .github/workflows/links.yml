name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so dead links get caught even without activity
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200,206,429
            --exclude-mail
            README.md CONTRIBUTING.md
          fail: true
